ext {
    // 24 (Android 7.0) because Play's automatic protection, which is on for
    // this app, rejects bundles with a lower minSdk. Build 5 already shipped at 24.
    minSdkVersion = 24
    // API 36 (Android 16) is required for Play submissions from Aug 31 2026
    // (see android/build.gradle for the matching AGP/Gradle bump). Edge-to-edge
    // was already enforced at API 35 and is handled by the safe-area padding in
    // src/theme/variables.scss; API 36 adds mandatory predictive-back handling,
    // which Capacitor's BridgeActivity already implements (MainActivity.java
    // doesn't override onBackPressed), so no app code changes were needed.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
}