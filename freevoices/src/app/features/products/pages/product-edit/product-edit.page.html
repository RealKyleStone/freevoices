<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="'/products/' + productId"></ion-back-button>
    </ion-buttons>
    <ion-title>Edit Product</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="loading-state" *ngIf="isFetching">
    <ion-spinner></ion-spinner>
  </div>

  <form class="form-container" [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!isFetching">

    <ion-card>
      <ion-card-header>
        <ion-card-title>Product Details</ion-card-title>
      </ion-card-header>
      <ion-card-content>

        <ion-item [class.ion-invalid]="isInvalid('name')">
          <ion-label position="stacked">Name <ion-text color="danger">*</ion-text></ion-label>
          <ion-input aria-label="Name" formControlName="name" type="text"></ion-input>
          <ion-note slot="error">Name is required (min 2 characters)</ion-note>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Description</ion-label>
          <ion-textarea aria-label="Description" formControlName="description" rows="3"></ion-textarea>
        </ion-item>

        <ion-item [class.ion-invalid]="isInvalid('price')">
          <ion-label position="stacked">Price <ion-text color="danger">*</ion-text></ion-label>
          <ion-input aria-label="Price" formControlName="price" type="number" min="0" step="0.01"></ion-input>
          <ion-note slot="error">A valid price is required</ion-note>
        </ion-item>

        <ion-item>
          <ion-label>VAT inclusive</ion-label>
          <ion-toggle formControlName="vat_inclusive" slot="end"></ion-toggle>
        </ion-item>

      </ion-card-content>
    </ion-card>

    <div class="form-actions">
      <ion-button expand="block" type="submit" [disabled]="isLoading">
        <ion-spinner *ngIf="isLoading" slot="start" name="crescent"></ion-spinner>
        {{ isLoading ? 'Saving...' : 'Save Changes' }}
      </ion-button>
    </div>

  </form>
</ion-content>
