<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>FreeVoices</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <!-- maximum-scale=1.0 and user-scalable=no were removed: together they block
       pinch-to-zoom, which fails WCAG 2.1 SC 1.4.4 (Resize Text) and stops
       anyone who needs magnification from reading an invoice. viewport-fit=cover
       is kept, so the Android edge-to-edge safe-area handling is unaffected. -->
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <!-- PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="FreeVoices" />
  <meta name="theme-color" content="#0f766e" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
